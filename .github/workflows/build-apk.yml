name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Copy web assets into the Android project
        run: npm run sync
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -Pvc=${{ github.run_number }} --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../TrainingLog-v1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TrainingLog-apk
          path: TrainingLog-v1.0.${{ github.run_number }}.apk
      - name: Publish release (download it from your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Training Log v1.0.${{ github.run_number }}
          body: Open this page on your Android phone and tap the .apk file below to install or update.
          files: TrainingLog-v1.0.${{ github.run_number }}.apk
